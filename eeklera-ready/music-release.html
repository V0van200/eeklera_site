<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<meta name="theme-color content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>Релиз — EEKLERA Wiki</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-screen-label="04 Release">
<main class="layout">
  <div data-sidenav></div>
  <section class="main" id="main"></section>
</main>
<script src="data.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const id = new URLSearchParams(location.search).get("id") || "bez-shansov";
  const m = window.EEK.music.find(x=>x.id===id) || window.EEK.music[0];
  const links = [
    m.url && {l:"BandLink",u:m.url},
    m.apple && {l:"Apple Music",u:m.apple},
    m.yandex && {l:"Яндекс Музыка",u:m.yandex},
    m.shazam && {l:"Shazam",u:m.shazam},
    m.vk && {l:"VK",u:m.vk}
  ].filter(Boolean);
  document.getElementById("main").innerHTML = `
    <div class="crumb"><a href="index.html">EEKLERA</a><span class="sep">/</span><a href="music.html">Музыка</a><span class="sep">/</span><span>${m.title}</span></div>
    <div class="kicker">сингл · ${m.year}</div>
    <h1 class="page-title">${m.title}</h1>
    <p class="lede">${m.desc}</p>
    <div style="display:grid;grid-template-columns:1fr 320px;gap:48px;margin-top:24px" id="g">
      <div>
        <h2 class="section-title" style="margin-top:0">Метаданные релиза</h2>
        <dl class="specs">
          <dt>Исполнитель</dt><dd>EEKLERA</dd>
          <dt>Название</dt><dd>${m.title}</dd>
          <dt>Тип</dt><dd>сингл</dd>
          <dt>Дата релиза</dt><dd>${m.date}</dd>
          <dt>Длительность</dt><dd>${m.duration}</dd>
          <dt>Лейбл</dt><dd>${m.label}</dd>
          <dt>Текст</dt><dd>${m.lyrics}</dd>
          <dt>Музыка</dt><dd>${m.composers}</dd>
          <dt>Статус</dt><dd>${window.EEKChrome.statusPill(m.status)}</dd>
        </dl>
        <h2 class="section-title">Слушать</h2>
        <div class="row">${links.map(x=>`<a class="btn" target="_blank" href="${x.u}">${x.l} →</a>`).join("")}</div>
        ${m.note?`<div class="note">${m.note}</div>`:""}
        <h2 class="section-title">Другие релизы</h2>
        <div class="cards-grid">
          ${window.EEK.music.filter(x=>x.id!==m.id).map(x=>`
            <a class="card card-link" href="music-release.html?id=${x.id}">
              <div class="meta"><span class="mono">${x.date}</span>${window.EEKChrome.statusPill(x.status)}</div>
              <div class="title">${x.title}</div><p class="desc">${x.duration} · ${x.label}</p>
            </a>`).join("")}
        </div>
      </div>
      <aside class="infobox">
        <div class="infobox-cover" style="background:radial-gradient(circle at 30% 30%, oklch(60% 0.18 25), oklch(20% 0.10 25));display:flex;align-items:flex-end"><span class="cap">обложка релиза</span></div>
        <div class="infobox-head"><div class="name">${m.title}</div><div class="alias">EEKLERA · ${m.year}</div></div>
        <div class="infobox-section">Сингл</div>
        <dl class="infobox-rows">
          <div class="infobox-row"><dt>Дата</dt><dd>${m.date}</dd></div>
          <div class="infobox-row"><dt>Длит.</dt><dd>${m.duration}</dd></div>
          <div class="infobox-row"><dt>Лейбл</dt><dd>${m.label}</dd></div>
        </dl>
      </aside>
    </div>
    <style>@media (max-width:980px){#g{grid-template-columns:1fr !important}}</style>`;
  document.title = m.title + " — EEKLERA Wiki";
});
</script>
<script src="mobile-nav.js"></script>
</body>
</html>
