<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<meta name="theme-color" content="#0a0908">
<title>Проект — EEKLERA Wiki</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="search-modal.css">
</head>
<body data-screen-label="03 Acting Project">
<main class="layout">
  <div data-sidenav></div>
  <section class="main" id="main"></section>
</main>
<script src="data.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const id = new URLSearchParams(location.search).get("id") || "revizory";
  const a = window.EEK.acting.find(x => x.id === id) || window.EEK.acting[0];
  const main = document.getElementById("main");
  const cover = a.id === "popytka-svyazi" ? "assets/film-popytka-svyazi.jpg" : `assets/photo-${String(((a.id.length*7)%12)+1).padStart(2,"0")}.jpg`;
  main.innerHTML = `
    <div class="crumb"><a href="index.html">EEKLERA</a><span class="sep">/</span><a href="acting.html">Актёрка</a><span class="sep">/</span><span>${a.title}</span></div>
    <div class="kicker">${a.format} · ${a.year ?? "год уточняется"}</div>
    <h1 class="page-title">${a.title}</h1>
    <p class="lede">${a.desc}</p>
    <div style="display:grid;grid-template-columns:1fr 320px;gap:48px;margin-top:24px" id="g">
      <div>
        <h2 class="section-title" style="margin-top:0">Карточка проекта</h2>
        <dl class="specs">
          <dt>Название</dt><dd>${a.title}</dd>
          <dt>Год</dt><dd>${a.year ?? "уточняется"}</dd>
          <dt>Формат</dt><dd>${a.format}</dd>
          <dt>Роль</dt><dd>${a.role}</dd>
          ${a.duration?`<dt>Длительность</dt><dd>${a.duration}</dd>`:""}
          ${a.rating?`<dt>Рейтинг</dt><dd>${a.rating}</dd>`:""}
          ${a.premiere?`<dt>Премьера</dt><dd>${a.premiere}</dd>`:""}
          <dt>Статус</dt><dd>${window.EEKChrome.statusPill(a.status)}</dd>
          <dt>Источники</dt><dd>${(a.sources||[]).join(" · ")}</dd>
        </dl>
        ${a.id==="revizory"?`<div class="quote">«Состоится закрытая премьера фильма “Ревизоры”, где я сыграла прекрасную Нину. nothing is impossible.»<cite>— Telegram EEKLERA, 29 апреля 2025</cite></div>`:""}
        <h2 class="section-title">Описание</h2>
        <div class="body"><p>${a.desc}</p>${a.status!=="confirmed"?`<div class="note">Часть данных требует уточнения по титрам / публичным карточкам — ${a.status==="partial"?"проект подтверждён, но детали уточняются":"проект упомянут в архиве, но требует подтверждения"}.</div>`:""}</div>

        <h2 class="section-title">Внешние ссылки</h2>
        <div class="row">
          <a class="btn" href="https://www.kinopoisk.ru/name/10256574/" target="_blank">Кинопоиск</a>
          <a class="btn" href="https://www.kino-teatr.ru/kino/acter/w/ros/1112902/works/" target="_blank">Кино-Театр</a>
          <a class="btn" href="https://ftoolz.ru/3902623/" target="_blank">Filmtoolz</a>
        </div>

        <h2 class="section-title">Связанные</h2>
        <div class="cards-grid">
          ${window.EEK.acting.filter(x=>x.id!==a.id).slice(0,3).map(x=>`
            <a class="card card-link" href="acting-project.html?id=${x.id}">
              <div class="meta"><span class="mono">${x.format}</span>${window.EEKChrome.statusPill(x.status)}</div>
              <div class="title">${x.title}</div><p class="desc">${x.year ?? "—"} · ${x.role}</p>
            </a>`).join("")}
        </div>
      </div>
      <aside class="infobox">
        <div class="infobox-cover" style="background-image:url('${cover}')"><span class="cap">${a.title}</span></div>
        <div class="infobox-head"><div class="name">${a.title}</div><div class="alias">${a.format}</div></div>
        <div class="infobox-section">Факты</div>
        <dl class="infobox-rows">
          <div class="infobox-row"><dt>Год</dt><dd>${a.year ?? "—"}</dd></div>
          <div class="infobox-row"><dt>Роль</dt><dd>${a.role}</dd></div>
          <div class="infobox-row"><dt>Статус</dt><dd>${window.EEKChrome.statusPill(a.status)}</dd></div>
        </dl>
      </aside>
    </div>
    <style>@media (max-width:980px){#g{grid-template-columns:1fr !important}}</style>
  `;
  document.title = a.title + " — EEKLERA Wiki";
});
</script>
<script src="mobile-nav.js"></script>
<script src="search-modal.js"></script>
</body>
</html>
