<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<meta name="theme-color" content="#0a0908">
<title>События — EEKLERA Wiki</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="search-modal.css">
</head>
<body data-screen-label="07 Events">
<main class="layout">
  <div data-sidenav></div>
  <section class="main">
    <div class="crumb"><a href="index.html">EEKLERA</a><span class="sep">/</span><span>События</span></div>
    <div class="kicker">07 · Events · публичные выходы</div>
    <h1 class="page-title">События<br>и выходы</h1>
    <p class="lede">Концерты, презентации, премьеры, fashion-показы и собственные мероприятия. Каждое — с датой, площадкой и статусом.</p>

    <div class="filters" style="margin-top:24px">
      <div class="filter-group">
        <span class="lbl">Тип</span>
        <button class="filter-btn active" data-type="all">Все</button>
        <button class="filter-btn" data-type="music">Музыка</button>
        <button class="filter-btn" data-type="film">Кино</button>
        <button class="filter-btn" data-type="fashion">Fashion</button>
        <button class="filter-btn" data-type="personal">Личные</button>
      </div>
    </div>

    <ul class="tl-events" id="evts" style="margin-top:24px"></ul>
  </section>
</main>
<script src="data.js"></script>
<script>
const evtList = [
  {id:"first-pravda-perf",date:"28·04·2024",ttl:"Первое выступление со своим треком",venue:"PRAVDA, Москва",type:"music",st:"confirmed"},
  {id:"premiere-revizory",date:"29·04·2025",ttl:"Закрытая премьера фильма «Ревизоры»",venue:"Москва · собственная red carpet",type:"film",st:"confirmed"},
  {id:"vikimouse-stream",date:"08·04·2025",ttl:"Совместный стрим с VIKIMOUSE",venue:"Twitch · готовка",type:"personal",st:"confirmed"},
  {id:"studio-stream",date:"23·02·2025",ttl:"Live-стрим из студии — трек с нуля",venue:"студия звукозаписи",type:"music",st:"confirmed"},
  {id:"lakhesis-danya",date:"13·12·2024",ttl:"Разогрев у Дани Единицы",venue:"Лахесис, Москва",type:"music",st:"confirmed"},
  {id:"gorod-slatt",date:"22·12·2024",ttl:"Клабшоу с SLATT SAVAGE",venue:"ГОРОД, Москва",type:"music",st:"confirmed"},
  {id:"birthday-eeklera",date:"04·08·2025",ttl:"Birthday EEKLERA",venue:"закрытая вечеринка, Москва",type:"personal",st:"confirmed"},
  {id:"trably-party",date:"29·08·2025",ttl:"Презентация трека «Траблы»",venue:"ЙОУ, Москва",type:"music",st:"confirmed"},
  {id:"wipo-eeklera",date:"27·09·2025",ttl:"WIPO & EEKLERA — клабшоу",venue:"PRAVDA CLUB, Москва",type:"music",st:"confirmed"},
  {id:"mone-impression",date:"20·10·2025",ttl:"MONE IMPRESSION 2025",venue:"fashion-показ, Москва",type:"fashion",st:"partial"},
  {id:"first-red-carpet",date:"08·12·2023",ttl:"Первая красная дорожка как гость",venue:"Москва",type:"film",st:"confirmed"},
  {id:"miss-tambov",date:"2021",ttl:"«Мисс Тамбовская область — 2021»",venue:"Тамбов · топ-10 финалисток",type:"fashion",st:"confirmed"},
];
function render(){
  const f = document.querySelector("[data-type].active").dataset.type;
  const list = evtList.filter(e=>f==="all"||e.type===f);
  document.getElementById("evts").innerHTML = list.map(e=>`
    <li id="${e.id}">
      <span class="date">${e.date}</span>
      <span class="title-cell">${e.ttl}<span class="desc">${e.venue} · <span class="mono-sm">${e.type}</span></span></span>
      ${window.EEKChrome.statusPill(e.st)}
    </li>`).join("");
}
document.addEventListener("DOMContentLoaded",()=>{
  render();
  document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("[data-type]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); render();
  });
  if(location.hash){setTimeout(()=>{const el=document.getElementById(location.hash.slice(1));if(el)el.style.background="oklch(95% 0.04 25)";},100);}
});
</script>
<script src="mobile-nav.js"></script>
<script src="search-modal.js"></script>
</body>
</html>
