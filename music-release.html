<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<meta name="theme-color" content="#0a0908">
<title>Релиз — EEKLERA Wiki</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="search-modal.css">
<style>
.lyrics-toggle {
  width: 100%;
  padding: 16px;
  background: rgba(201,165,95,0.05);
  border: 1px solid rgba(201,165,95,0.2);
  border-radius: 8px;
  color: var(--accent);
  cursor: pointer;
  margin: 16px 0;
}
.lyrics-toggle:hover {
  background: rgba(201,165,95,0.1);
}
</style>
</head>
<body data-screen-label="04 Release">
<main class="layout">
  <div data-sidenav></div>
  <section class="main" id="main"></section>
</main>

<!-- Кнопка открытия поиска -->
<button class="search-trigger" id="searchTrigger" aria-label="Открыть поиск">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="8"></circle>
    <path d="m21 21-4.35-4.35"></path>
  </svg>
  <span>Поиск</span>
</button>

<!-- Модальное окно поиска -->
<div class="search-modal" id="searchModal">
  <div class="search-modal-backdrop"></div>
  <div class="search-modal-content">
    <button class="search-close" aria-label="Закрыть" id="searchClose">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    
    <div class="search-header">
      <h2>Поиск по wiki</h2>
      <p>Введите запрос для поиска по сайту</p>
    </div>

    <div class="search-input-wrapper">
      <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input 
        type="text" 
        class="search-input" 
        placeholder="Актриса, модель, стриминг..." 
        id="searchInput"
        autocomplete="off"
      />
      <kbd class="search-kbd">ESC</kbd>
    </div>

    <div class="search-results" id="searchResults">
      <div class="search-empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <p>Начните вводить для поиска</p>
      </div>
    </div>

    <div class="search-footer">
      <div class="search-shortcuts">
        <kbd>↑</kbd>
        <kbd>↓</kbd>
        <span>Навигация</span>
        <kbd>↵</kbd>
        <span>Выбрать</span>
        <kbd>ESC</kbd>
        <span>Закрыть</span>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="mobile-nav.js"></script>
<script src="search-modal.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const id = new URLSearchParams(location.search).get("id") || "bez-shansov";
  const m = window.EEK.music.find(x=>x.id===id) || window.EEK.music[0];
  const links = [
    m.url && {l:"BandLink",u:m.url},
    m.apple && {l:"Apple Music",u:m.apple},
    m.yandex && {l:"Яндекс Музыка",u:m.yandex},
    m.shazam && {l:"Shazam",u:m.shazam},
    m.vk && {l:"VK",u:m.vk}
  ].filter(Boolean);
  
  // Определяем обложку для каждого трека
  const getCoverImage = (trackId) => {
    const covers = {
      'bez-shansov': 'assets/cover-bez-shansov.jpg',
      'trably': 'assets/cover-trably.jpg',
      'nudnaya-pechal': 'assets/cover-nudnaya-pechal.jpg'
    };
    return covers[trackId] || null;
  };
  
  const coverImage = getCoverImage(m.id);
  const coverStyle = coverImage 
    ? `background-image: url('${coverImage}'); background-size: cover; background-position: center;`
    : `background: radial-gradient(circle at 30% 30%, oklch(60% 0.18 25), oklch(20% 0.10 25)); display: flex; align-items: flex-end;`;
  
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="crumb"><a href="index.html">EEKLERA</a><span class="sep">/</span><a href="music.html">Музыка</a><span class="sep">/</span><span>${m.title}</span></div>
    <div class="kicker">сингл · ${m.year}</div>
    <h1 class="page-title">${m.title}</h1>
    <p class="lede">${m.desc || `Официальный релиз EEKLERA ${m.year} года.`}</p>
    <div style="display:grid;grid-template-columns:1fr 320px;gap:48px;margin-top:24px" id="g">
      <div>
        <h2 class="section-title" style="margin-top:0">Метаданные релиза</h2>
        <dl class="specs">
          <dt>Исполнитель</dt><dd>EEKLERA</dd>
          <dt>Название</dt><dd>${m.title}</dd>
          <dt>Тип</dt><dd>сингл</dd>
          <dt>Дата релиза</dt><dd>${m.date}</dd>
          <dt>Длительность</dt><dd>${m.duration}</dd>
          ${m.label ? `<dt>Лейбл</dt><dd>${m.label}</dd>` : ''}
          ${m.lyrics ? `<dt>Текст</dt><dd>${m.lyrics}</dd>` : ''}
          ${m.composers ? `<dt>Музыка</dt><dd>${m.composers}</dd>` : ''}
          <dt>Статус</dt><dd>${window.EEKChrome.statusPill(m.status)}</dd>
        </dl>
        ${links.length > 0 ? `
        <h2 class="section-title">Слушать</h2>
        <div class="row">${links.map(x=>`<a class="btn" target="_blank" href="${x.u}">${x.l} →</a>`).join("")}</div>
        ` : ''}
        ${m.note?`<div class="note">${m.note}</div>`:""}
        <h2 class="section-title">Другие релизы</h2>
        <div class="cards-grid">
          ${window.EEK.music.filter(x=>x.id!==m.id).map(x=>`
            <a class="card card-link" href="music-release.html?id=${x.id}">
              <div class="meta"><span class="mono">${x.date}</span>${window.EEKChrome.statusPill(x.status)}</div>
              <div class="title">${x.title}</div><p class="desc">${x.duration} · ${x.label || 'релиз'}</p>
            </a>`).join("")}
        </div>
      </div>
      <aside class="infobox">
        <div class="infobox-cover" style="${coverStyle}">
          ${!coverImage ? '<span class="cap">обложка релиза</span>' : ''}
        </div>
        <div class="infobox-head"><div class="name">${m.title}</div><div class="alias">EEKLERA · ${m.year}</div></div>
        <div class="infobox-section">Сингл</div>
        <dl class="infobox-rows">
          <div class="infobox-row"><dt>Дата</dt><dd>${m.date}</dd></div>
          <div class="infobox-row"><dt>Длит.</dt><dd>${m.duration}</dd></div>
          ${m.label ? `<div class="infobox-row"><dt>Лейбл</dt><dd>${m.label}</dd></div>` : ''}
        </dl>
      </aside>
    </div>
    <style>@media (max-width:980px){#g{grid-template-columns:1fr !important}}</style>`;
  document.title = m.title + " — EEKLERA Wiki";
});
</script>
<script>
function toggleLyrics() {
  const content = document.getElementById("lyrics-content");
  const button = document.getElementById("lyrics-toggle");
  
  if (content.style.display === "none" || content.style.display === "") {
    content.style.display = "block";
    button.innerHTML = "📝 Скрыть текст песни";
  } else {
    content.style.display = "none";
    button.innerHTML = "📝 Показать текст песни";
  }
}
</script>
</body>
</html>
